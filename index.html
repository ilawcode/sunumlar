<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Turkcell AI Destekli Analiz ve Geliştirme Sunumu</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter as high-quality sans-serif alternative to Helvetica Neue/Calibri -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Calibri', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .slide-shadow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    /* Brand gradient backgrounds */
    .bg-turkcell-radial {
      background: radial-gradient(circle at center, #011BF6 0%, #08164E 70%, #09155D 100%);
    }
    .bg-brand-gray {
      background-color: #F4F5F8;
    }
    .text-turkcell-navy {
      color: #001480;
    }
    .bg-turkcell-navy {
      background-color: #001480;
    }
    .bg-turkcell-yellow {
      background-color: #FFC000;
    }
    /* Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #FFC000;
    }

    /* Native Fullscreen Styles */
    #presentationStage:fullscreen {
      width: 100vw !important;
      height: 100vh !important;
      padding: 3rem !important;
      background-color: #020617 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
    }
    #presentationStage:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      padding: 3rem !important;
      background-color: #020617 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Virtual Fullscreen Fallback */
    .virtual-fullscreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background-color: #020617 !important;
      z-index: 99999 !important;
      padding: 3rem !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: center !important;
    }

    #presentationStage:fullscreen #slideContainer,
    .virtual-fullscreen #slideContainer {
      max-width: none !important;
      max-height: none !important;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body class="overflow-x-hidden">

  <!-- Main App Shell -->
  <div class="min-h-screen flex flex-col">
    
    <!-- Top Bar -->
    <header class="bg-[#08164E] border-b border-[#001480]/30 px-6 py-4 flex items-center justify-between shadow-lg">
      <div class="flex items-center gap-4">
        <!-- Turkcell SVG Logo -->
        <div class="flex items-center gap-3">
          <svg class="w-10 h-10 flex-shrink-0" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="60" cy="60" r="50" fill="#FFC000"/>
            <path d="M28 80C34 54 55 42 74 42" stroke="#001480" stroke-width="8" stroke-linecap="round"/>
            <circle cx="74" cy="42" r="8" fill="#001480"/>
            <path d="M42 90C48 70 70 60 88 60" stroke="#001480" stroke-width="8" stroke-linecap="round"/>
            <circle cx="88" cy="60" r="8" fill="#001480"/>
          </svg>
          <div>
            <span class="text-xs text-[#FFC000] font-bold tracking-widest block uppercase">Turkcell SQUAD Raporu</span>
            <h1 class="text-base font-extrabold text-white tracking-tight">AI DESTEKLİ GELİŞTİRME ANALİZİ</h1>
          </div>
        </div>
      </div>
      
      <!-- Center Controls -->
      <div class="flex bg-slate-900/80 rounded-full p-1 border border-slate-700/50">
        <button onclick="setViewMode('present')" id="btn-present" class="px-4 py-1.5 rounded-full text-xs font-semibold transition-all text-white bg-[#001480]">Sunum Modu</button>
        <button onclick="setViewMode('sorter')" id="btn-sorter" class="px-4 py-1.5 rounded-full text-xs font-semibold transition-all text-slate-400">Sorter</button>
        <button onclick="setViewMode('editor')" id="btn-editor" class="px-4 py-1.5 rounded-full text-xs font-semibold transition-all text-slate-400">Editör</button>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <span class="text-xs px-2.5 py-1 rounded bg-[#09155D] text-slate-300 font-mono tracking-wider border border-[#001480]/40">TURKCELL GENEL</span>
        <button onclick="resetToDefaultSlides()" class="p-2 hover:bg-slate-800 rounded-lg text-xs text-[#FFC000] border border-slate-700/50">Sıfırla</button>
      </div>
    </header>

    <!-- Content -->
    <main class="flex-1 flex overflow-hidden">
      
      <!-- Sidebar Nav -->
      <aside id="sidebar-navigator" class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto">
        <div id="nav-slides-list" class="p-3 space-y-3"></div>
      </aside>

      <!-- Stage -->
      <section id="presentationStage" class="flex-1 bg-slate-950 p-6 flex flex-col items-center justify-center relative overflow-hidden">
        <div id="slideContainer" class="w-full h-full max-w-[1280px] max-h-[720px] aspect-[16/9] flex items-center justify-center relative">
          <div id="widescreenSlide" class="relative bg-white w-[1920px] h-[1080px] origin-center slide-shadow transition-all duration-300 overflow-hidden text-[#001480]"></div>
        </div>

        <!-- Controls -->
        <div class="mt-4 flex items-center gap-4 bg-slate-900/90 border border-slate-800 px-6 py-2 rounded-full z-10">
          <button onclick="prevSlide()" class="p-2 hover:text-[#FFC000]">◀</button>
          <span id="slide-index-indicator" class="text-sm font-bold text-slate-300">1 / 16</span>
          <button onclick="nextSlide()" class="p-2 hover:text-[#FFC000]">▶</button>
          <button onclick="toggleAutoPlay()" id="btn-play" class="text-xs text-[#FFC000] px-2 font-bold">Auto</button>
          <button onclick="toggleFullscreen()" class="p-2 text-slate-400">Fullscreen</button>
        </div>
      </section>

      <!-- Right Panel -->
      <aside id="right-panel" class="w-80 bg-slate-900 border-l border-slate-800 flex flex-col overflow-y-auto">
        <div class="flex border-b border-slate-800 text-xs">
          <button onclick="setRightTab('diagnostics')" id="tab-diagnostics" class="flex-1 py-3 text-center border-[#FFC000] text-white">REHBER</button>
          <button onclick="setRightTab('editor')" id="tab-editor" class="flex-1 py-3 text-center text-slate-400">DÜZENLE</button>
        </div>
        <div id="panel-diagnostics" class="p-4 space-y-4"></div>
        <div id="panel-editor" class="p-4 space-y-4 hidden">
            <input type="text" id="edit-title" oninput="updateCurrentSlideData()" class="w-full bg-slate-800 border rounded p-2 text-xs mb-2">
            <textarea id="edit-bullets" rows="10" oninput="updateCurrentSlideData()" class="w-full bg-slate-800 border rounded p-2 text-xs"></textarea>
        </div>
      </aside>
    </main>

    <!-- Sorter -->
    <div id="sorter-view" class="fixed inset-0 bg-slate-950 z-50 overflow-y-auto p-8 hidden">
        <div id="sorter-grid" class="grid grid-cols-3 gap-6"></div>
    </div>

    <!-- Toast -->
    <div id="custom-toast" class="fixed bottom-6 right-6 px-4 py-2 bg-slate-800 text-[#FFC000] border border-[#FFC000] rounded-lg opacity-0 transition-all"></div>

  </div>

  <script>
    const DEFAULT_SLIDES = [
      { id: "s1", type: "cover", title: "AI DESTEKLİ ANALİZ VE GELİŞTİRME SÜREÇLERİ", subtitle: "SQUAD Gelişim ve Hız Analiz Raporu", date: "21.05.2026", bullets: [] },
      { id: "s2", type: "separator", title: "1. EKİP YAPISI", subtitle: "SQUAD Yapı Taşları ve Çalışma Modelimiz", date: "21.05.2026", bullets: [] },
      { id: "s3", type: "content", lumos: "left-vertical", title: "SQUAD Yapımız", subtitle: "1. Ekip Yapısı", date: "21.05.2026", bullets: [
          "SQUAD yapımız: 1 PO, 1 DEL ve 5 Developer kadrosundan oluşmaktadır.",
          "Bu iş özelinde geliştirme tarafında ağırlıklı olarak tek developer çalıştı.",
          "Bu nedenle analiz ve geliştirme süreçlerinde elde edilen hız kazanımı, toplam iş teslim süresine doğrudan etki etti."
        ]
      },
      { id: "s4", type: "separator", title: "2. ANALİZ SÜREÇLERİ", subtitle: "Yapay Zeka Destekli Teknik Akış Analizleri", date: "21.05.2026", bullets: [] },
      { id: "s5", type: "bullets-photo", title: "Özel Şifre Yetkilisi Akış Analizi", subtitle: "2.1. Teknik Akış Analizi", date: "21.05.2026", bullets: [
          "Turkcell Online üzerinde Özel Şifre Yetkilisi tanımlandığında, akışın imza sirküleri yetkilisine gönderildiği sürecin teknik analizi çıkarıldı.",
          "Ekranlarda çalışan 2 API ve arkada çalışan 2 altyapı servisi tespit edilip dokümante edildi.",
          "Manuelde 2 gün sürecek analiz dokümantasyonu AI desteği ile yaklaşık 2 saatte tamamlandı."
        ], metric: { label: "Analiz Süresi", before: "2 Gün", after: "2 Saat", ratio: "24 Kat Hız" }
      },
      { id: "s6", type: "bullets-photo", title: "Kısıtlı Yetkili Ekleme Akış Analizi", subtitle: "2.2. Cursor ile Kod Analizi", date: "21.05.2026", bullets: [
          "Analiz doğrudan Cursor ile mevcut kod üzerinden çıkarıldı.",
          "CRM servis çağrıları, parametreler, API yapıları ve doğrulama kuralları netleştirildi.",
          "Normalde 8 saat sürecek bir analiz çalışması, AI desteği ile sadece 25 dakikada tamamlandı."
        ], metric: { label: "Kod Analizi", before: "8 Saat", after: "25 Dak", ratio: "19 Kat Hız" }
      },
      { id: "s7", type: "content", lumos: "horizontal-under", title: "Login Etki Analizi", subtitle: "2.3. Karmaşık Akış Tespiti", date: "21.05.2026", bullets: [
          "Onaysız ÖŞY kullanıcılarının login olmaması için karmaşık login akışı AI ile analiz edildi.",
          "AI desteği ile normalde 2 gün sürecek etki analizi çalışması 6 saatte tamamlanabildi.",
          "Hızlı tespit sayesinde login blokaj senaryoları vakit kaybetmeden geliştirme aşamasına aktarıldı."
        ]
      },
      { id: "s8", type: "separator", title: "3. DEV SÜREÇLERİ", subtitle: "Geliştirme ve Test Verimlilik Metrikleri", date: "21.05.2026", bullets: [] },
      { id: "s9", type: "content", lumos: "left-vertical", title: "Yapay Zeka Kullandığımız Alanlar", subtitle: "3.1. Development Uygulamaları", date: "21.05.2026", bullets: [
          "Analiz çıktılarının geliştirme işine (task) dönüştürülmesi ve dev planlama süreçleri.",
          "Mevcut teknik akışın daha hızlı netleştirilmesi adımlarında Cursor/AI kullanımı.",
          "Özellikle birim (unit) testlerin tamamı yapay zeka araçları ile yazdırıldı.",
          "8 saat sürecek unit test yazımı 1.5 saate düşürülerek %81 tasarruf sağlandı."
        ]
      },
      { id: "s10", type: "bullets-photo", title: "Geliştirme Eforu Tasarruf Analizi", subtitle: "7 Günden 5 Güne İnişin Matematiği", date: "21.05.2026", bullets: [
          "Geleneksel Metot: 7 iş günü süren manuel kodlama ve test döngüsü.",
          "AI Hazırlık Hızı: Analizden tasklaştırmaya geçişte kazanılan 8 saat.",
          "Test Hızı: Unit testlerin AI ile üretilmesinde kazanılan 6.5 saat.",
          "Sonuç: Toplamda 16 saatlik (2 Tam Gün) operasyonel hız kazanımı.",
          "Verimlilik: Süreç bazlı %28.5 oranında net zaman tasarrufu."
        ], metric: { label: "Toplam Efor", before: "7 Gün", after: "5 Gün", ratio: "-2 Gün (%28.5)" }
      },
      { id: "s11", type: "content", lumos: "quarter-circle", title: "AI Sınırlı Kaldığımız Alanlar", subtitle: "3.2. Metodolojik Kısıtlar", date: "21.05.2026", bullets: [
          "Kullanımın tam verimli olmamasının nedeni, sürecin prompt bazlı ilerlemesidir.",
          "Henüz skill üretme veya agent mantığında yapılandırılmış bir modele geçilmedi.",
          "Bu nedenle AI kullanımı akışa tam gömülü değil, destekleyici seviyede kaldı."
        ]
      },
      { id: "s12", type: "content", lumos: "left-vertical", title: "ÖŞY Login Kod Düzenlemeleri", subtitle: "3.2.1 Manuel Müdahale Alanları", date: "21.05.2026", bullets: [
          "Karmaşık login akışında hat tipi ve yetki kontrollerinde AI yetersiz kaldı.",
          "Mobil ve web için ayrışan akışlarda manuel kodlama zorunlu oldu.",
          "Hata raporlama, loglama ve güvenlik kontrollerinde insan denetimi baskın ilerledi."
        ]
      },
      { id: "s13", type: "separator", title: "4. SONUÇ VE VİZYON", subtitle: "SQUAD Verimlilik Çıktıları", date: "21.05.2026", bullets: [] },
      { id: "s14", type: "content", lumos: "horizontal-under", title: "Kısa Sonuç Raporu", subtitle: "Genel Değerlendirme", date: "21.05.2026", bullets: [
          "Manuelde toplam 12-14 gün sürecek analiz ve test adımları AI ile saatler seviyesine indi.",
          "Geliştirme eforu 7 günden 5 güne, unit test süresi 8 saatten 1.5 saate düşürüldü.",
          "Somut hız kazancı; teknik hazırlık, dokümantasyon ve test üretiminde en üst seviyededir.",
          "Vizyon: Prompt bazlı kullanımdan, akışa tam gömülü skill/agent yapısına geçişle verim %100'e taşınabilir."
        ]
      },
      { id: "s15", type: "chart", title: "Süreç Kazanımları Özeti", subtitle: "Birim Bazlı Ölçeklendirilmiş Tasarruf", date: "21.05.2026", bullets: [], chartData: [
          { name: "ÖŞY Akış Analizi", before: 48, after: 2, labelBefore: "2 Gün", labelAfter: "2 Saat" },
          { name: "Kısıtlı Yetkili Akışı", before: 8, after: 0.41, labelBefore: "8 Saat", labelAfter: "25 Dak" },
          { name: "Login Etki Analizi", before: 48, after: 6, labelBefore: "2 Gün", labelAfter: "6 Saat" },
          { name: "Geliştirme Eforu", before: 168, after: 120, labelBefore: "7 Gün", labelAfter: "5 Gün" },
          { name: "Unit Test Yazımı", before: 8, after: 1.5, labelBefore: "8 Saat", labelAfter: "1.5 Saat" }
        ]
      },
      { id: "s16", type: "cover", title: "TEŞEKKÜRLER", subtitle: "SQUAD Verimlilik Raporu | 2026", date: "21.05.2026", bullets: [] }
    ];

    let slides = JSON.parse(localStorage.getItem('turkcell_slides_v2')) || JSON.parse(JSON.stringify(DEFAULT_SLIDES));
    let currentSlideIndex = 0;
    let viewMode = 'present';
    let autoPlayInterval = null;
    let isVirtualFullscreen = false;

    window.onload = function() {
      renderSlideList();
      renderCurrentSlide();
      setupScaling();
      window.addEventListener('resize', setupScaling);
      document.addEventListener('keydown', (e) => {
        if(e.key === 'ArrowRight') nextSlide();
        if(e.key === 'ArrowLeft') prevSlide();
        if(e.key === 'Escape' && isVirtualFullscreen) toggleFullscreen();
      });
    };

    function setupScaling() {
      const container = document.getElementById('slideContainer');
      const slide = document.getElementById('widescreenSlide');
      if(!container || !slide) return;
      const scale = Math.min(container.clientWidth / 1920, container.clientHeight / 1080);
      slide.style.transform = `scale(${scale})`;
    }

    function renderCurrentSlide() {
      const canvas = document.getElementById('widescreenSlide');
      const slide = slides[currentSlideIndex];
      canvas.className = "relative w-[1920px] h-[1080px] overflow-hidden";
      
      let html = `<div class="absolute top-10 right-12 text-slate-400 font-mono text-sm">TURKCELL GENEL</div>`;
      
      if(slide.type === 'cover') {
        canvas.classList.add('bg-turkcell-radial');
        html += `
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-20">
            <div class="mb-10 w-24 h-24 bg-[#FFC000] rounded-full flex items-center justify-center">
                <svg class="w-16 h-16" viewBox="0 0 120 120"><circle cx="60" cy="60" r="50" fill="#FFC000"/><path d="M28 80C34 54 55 42 74 42M42 90C48 70 70 60 88 60" stroke="#001480" stroke-width="8" stroke-linecap="round"/></svg>
            </div>
            <h1 class="text-white text-7xl font-black mb-6 uppercase">${slide.title}</h1>
            <p class="text-[#00C2FF] text-3xl font-medium">${slide.subtitle}</p>
          </div>
          <div class="absolute bottom-16 w-full text-center text-slate-400 font-mono">Yayın Tarihi: ${slide.date}</div>
        `;
      } else if(slide.type === 'separator') {
        canvas.classList.add('bg-[#08164E]');
        html += `
          <div class="absolute inset-0 flex flex-col justify-center px-32">
            <div class="w-40 h-3 bg-[#FFC000] rounded-full mb-10"></div>
            <span class="text-[#FFC000] text-3xl font-mono mb-4 uppercase">${slide.subtitle}</span>
            <h2 class="text-white text-6xl font-black uppercase max-w-5xl">${slide.title}</h2>
          </div>
        `;
      } else if(slide.type === 'content') {
        canvas.classList.add('bg-white');
        html += `<div class="h-4 bg-gradient-to-r from-[#001480] via-[#00C2FF] to-[#FFC000]"></div>
                 <div class="px-24 pt-24"><h2 class="text-6xl font-black uppercase">${slide.title}</h2><p class="text-slate-400 text-xl font-mono mt-2">${slide.subtitle}</p></div>
                 <div class="px-24 pt-16 relative">
                    ${slide.lumos === 'left-vertical' ? '<div class="absolute left-16 top-16 bottom-0 w-2 bg-[#FFC000] rounded-full"></div>' : ''}
                    <ul class="space-y-8 pl-4">
                        ${slide.bullets.map(b => `<li class="flex items-start gap-6"><span class="w-4 h-4 bg-[#FFC000] rounded-full mt-3"></span><span class="text-4xl font-medium leading-tight">${b}</span></li>`).join('')}
                    </ul>
                 </div>`;
      } else if(slide.type === 'bullets-photo') {
        canvas.classList.add('bg-white');
        const m = slide.metric;
        html += `<div class="h-4 bg-gradient-to-r from-[#001480] via-[#00C2FF] to-[#FFC000]"></div>
                 <div class="px-24 pt-20"><h2 class="text-6xl font-black uppercase">${slide.title}</h2><p class="text-slate-400 text-xl font-mono mt-2">${slide.subtitle}</p></div>
                 <div class="px-24 pt-12 grid grid-cols-12 gap-16 items-center">
                    <div class="col-span-7"><ul class="space-y-6">${slide.bullets.map(b => `<li class="flex items-start gap-4"><span class="w-3 h-3 bg-[#FFC000] rounded-full mt-2.5"></span><span class="text-3xl font-medium">${b}</span></li>`).join('')}</ul></div>
                    <div class="col-span-5 relative">
                        <div class="absolute -inset-2 bg-gradient-to-tr from-[#FFC000] to-[#001480] rounded-3xl opacity-20"></div>
                        <div class="relative bg-slate-900 text-white rounded-2xl p-10 text-center border border-slate-700 shadow-2xl">
                            <div class="text-[#FFC000] text-xs font-bold tracking-widest mb-6 uppercase">${m.label}</div>
                            <div class="flex justify-between items-center px-4">
                                <div><div class="text-slate-500 text-xs uppercase mb-2">Önce</div><div class="text-4xl font-mono text-slate-400 line-through">${m.before}</div></div>
                                <div class="text-[#FFC000] text-4xl">➜</div>
                                <div><div class="text-[#00C2FF] text-xs uppercase mb-2">Sonra</div><div class="text-5xl font-black text-white font-mono">${m.after}</div></div>
                            </div>
                            <div class="mt-10 pt-8 border-t border-slate-800"><div class="text-slate-500 text-sm mb-1">Net Kazanım</div><div class="text-6xl font-black text-[#FFC000]">${m.ratio}</div></div>
                        </div>
                    </div>
                 </div>`;
      } else if(slide.type === 'chart') {
        canvas.classList.add('bg-white');
        html += `<div class="h-4 bg-gradient-to-r from-[#001480] via-[#00C2FF] to-[#FFC000]"></div>
                 <div class="px-24 pt-20"><h2 class="text-6xl font-black uppercase">${slide.title}</h2><p class="text-slate-400 text-xl font-mono mt-2">${slide.subtitle}</p></div>
                 <div class="px-24 pt-10 grid grid-cols-12 gap-10">
                    <div class="col-span-8 space-y-4">
                        ${slide.chartData.map(item => {
                            const ratio = (item.after / item.before) * 100;
                            const saved = Math.round(100 - ratio);
                            return `
                                <div class="space-y-1">
                                    <div class="flex justify-between items-end"><span class="text-2xl font-bold">${item.name}</span><span class="text-xs font-black text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">-%${saved} Tasarruf</span></div>
                                    <div class="bg-slate-100 h-6 rounded-full overflow-hidden flex items-center px-4 bg-[#001480]"><span class="text-white text-[10px] font-mono">${item.labelBefore} (Geleneksel)</span></div>
                                    <div class="flex items-center gap-2">
                                        <div class="bg-slate-100 h-6 rounded-full flex-1 relative flex items-center overflow-hidden">
                                            <div class="bg-[#FFC000] h-full transition-all duration-1000" style="width: ${ratio}%"></div>
                                            <span class="absolute left-4 text-[10px] font-black text-[#001480]">${item.labelAfter} (YZ Destekli)</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                    <div class="col-span-4 bg-slate-50 p-8 rounded-2xl border flex flex-col justify-between">
                        <div class="text-[#001480] font-black text-xs tracking-widest uppercase mb-4">Ölçeklendirme Notu</div>
                        <p class="text-slate-500 text-sm italic">Her birim, devasa efor farklarından etkilenmeden kendi baz süresi (%100) üzerinden bağımsız ölçeklenmiştir. Bu sayede dakikalık kazanımlar bile net görünür haldedir.</p>
                    </div>
                 </div>`;
      }

      canvas.innerHTML = html;
      document.getElementById('slide-index-indicator').innerText = `${currentSlideIndex + 1} / ${slides.length}`;
    }

    function selectSlide(idx) { currentSlideIndex = idx; renderCurrentSlide(); renderSlideList(); }
    function nextSlide() { currentSlideIndex = (currentSlideIndex + 1) % slides.length; renderCurrentSlide(); renderSlideList(); }
    function prevSlide() { currentSlideIndex = (currentSlideIndex - 1 + slides.length) % slides.length; renderCurrentSlide(); renderSlideList(); }

    function toggleFullscreen() {
        const stage = document.getElementById('presentationStage');
        if(!document.fullscreenElement && !isVirtualFullscreen) {
            if(stage.requestFullscreen) stage.requestFullscreen();
            else { stage.classList.add('virtual-fullscreen'); isVirtualFullscreen = true; }
        } else {
            if(document.exitFullscreen) document.exitFullscreen();
            stage.classList.remove('virtual-fullscreen'); isVirtualFullscreen = false;
        }
        setTimeout(setupScaling, 100);
    }

    function renderSlideList() {
      const container = document.getElementById('nav-slides-list');
      container.innerHTML = slides.map((s, i) => `
        <div onclick="selectSlide(${i})" class="p-3 rounded-lg cursor-pointer border ${i === currentSlideIndex ? 'bg-[#001480]/20 border-[#FFC000] text-[#FFC000]' : 'bg-slate-800/50 border-slate-700 text-slate-400'}">
            <div class="text-[9px] uppercase font-bold opacity-60">${i+1}. Slayt - ${s.type}</div>
            <div class="text-xs font-bold truncate">${s.title}</div>
        </div>
      `).join('');
    }

    function setViewMode(mode) {
        document.getElementById('sorter-view').classList.toggle('hidden', mode !== 'sorter');
        if(mode === 'sorter') renderSorter();
        setupScaling();
    }

    function renderSorter() {
        document.getElementById('sorter-grid').innerHTML = slides.map((s, i) => `
            <div onclick="selectSlide(${i}); setViewMode('present')" class="bg-slate-900 border border-slate-800 p-4 rounded-xl hover:border-[#FFC000] cursor-pointer">
                <div class="text-xs text-slate-500 mb-2">${i+1}. Slayt</div>
                <div class="text-white font-bold text-sm">${s.title}</div>
            </div>
        `).join('');
    }

    function toggleAutoPlay() {
        if(autoPlayInterval) { clearInterval(autoPlayInterval); autoPlayInterval = null; showToast("AutoPlay Durdu"); }
        else { autoPlayInterval = setInterval(nextSlide, 5000); showToast("AutoPlay Başladı (5sn)"); }
    }

    function showToast(msg) {
        const t = document.getElementById('custom-toast');
        t.innerText = msg; t.classList.add('opacity-100');
        setTimeout(() => t.classList.remove('opacity-100'), 2000);
    }

    function setRightTab(tab) {
        document.getElementById('panel-diagnostics').classList.toggle('hidden', tab !== 'diagnostics');
        document.getElementById('panel-editor').classList.toggle('hidden', tab !== 'editor');
        if(tab === 'editor') {
            document.getElementById('edit-title').value = slides[currentSlideIndex].title;
            document.getElementById('edit-bullets').value = slides[currentSlideIndex].bullets.join('\n');
        }
    }

    function updateCurrentSlideData() {
        slides[currentSlideIndex].title = document.getElementById('edit-title').value;
        slides[currentSlideIndex].bullets = document.getElementById('edit-bullets').value.split('\n').filter(l => l.trim() !== '');
        renderCurrentSlide();
        localStorage.setItem('turkcell_slides_v2', JSON.stringify(slides));
    }

    function resetToDefaultSlides() {
        localStorage.removeItem('turkcell_slides_v2');
        location.reload();
    }
  </script>
</body>
</html>
